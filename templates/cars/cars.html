{% extends 'layout.html' %}

{% block title %}
{{ title }}
{% endblock %}

{% block content %}
<div class="container">
  <h1>{{ title }}</h1>
  <hr>

 
  <form method="post" class="mb-3">
    <div class="input-group">
      <input type="text" name="brand" class="form-control"
             placeholder="Search by car's brand">
      <button class="btn btn-outline-success">
        <i class="bi bi-search"></i>
      </button>
    </div>
  </form>


  <div class="row mb-3">
    <div class="col text-end">
      <a href="{{ url_for('new_car') }}" class="btn btn-outline-success">
        <i class="bi bi-car-front"></i> Add New Car
      </a>
    </div>
  </div>

  <table class="table table-hover">
    <thead>
      <tr>
        <th>#</th>
        <th>Brand</th>
        <th>Model</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      {% for car in cars %}
      <tr>
        <td>{{ loop.index }}</td>
        <td>{{ car.brand }}</td>
        <td>{{ car.model }}</td>
        <td>
          <a href="{{ url_for('edit_car', id=car.id) }}"
             class="btn btn-outline-success btn-sm">
             Edit
          </a>
          <a href="{{ url_for('delete_car', id=car.id) }}"
             class="btn btn-outline-danger btn-sm">
             Delete
          </a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
